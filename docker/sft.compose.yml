# GR00T N1.6 SFT — build once, run per family.
#   docker compose -f docker/sft.compose.yml build
#   docker compose -f docker/sft.compose.yml run --rm sft --family jar
#   docker compose -f docker/sft.compose.yml run --rm sft --all
# HF_TOKEN + WANDB_API_KEY are read from the host environment.
services:
  sft:
    build:
      context: ..
      dockerfile: docker/sft.Dockerfile
    image: gr00t-maniguard-sft
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - HF_TOKEN
      - WANDB_API_KEY
    volumes:
      - ../outputs:/workspace/outputs
